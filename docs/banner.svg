<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Financial BI: ERP to PostgreSQL ETL and SQL analytics with row-level security for two companies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.30"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#58a6ff"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#58a6ff" letter-spacing="2">FINANCIAL BI · IN PRODUCTION</text>
  <text x="92" y="167" class="sans" font-size="88" font-weight="800" fill="url(#shine)">Financial BI</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">ERP to PostgreSQL ETL and SQL analytics with row-level</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">security for two companies</text>
  <rect x="96" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.45"/><text x="132" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Python</text><rect x="177" y="262" width="104" height="28" rx="14" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.45"/><text x="229" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">PostgreSQL</text><rect x="291" y="262" width="63" height="28" rx="14" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.45"/><text x="323" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Flask</text><rect x="364" y="262" width="88" height="28" rx="14" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.45"/><text x="408" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Supabase</text>
  <g><rect x="850" y="40" width="380" height="280" rx="16" fill="#0f161f" stroke="#2a3542"/><rect x="870" y="60" width="104" height="54" rx="8" fill="#161f2b"/><rect x="986" y="60" width="104" height="54" rx="8" fill="#161f2b"/><rect x="1102" y="60" width="108" height="54" rx="8" fill="#161f2b"/><text x="882" y="82" class="mono" font-size="10" fill="#8b949e">CLOSE TIME</text><text x="882" y="104" class="sans" font-size="20" font-weight="800" fill="#58a6ff">-60%</text><text x="998" y="82" class="mono" font-size="10" fill="#8b949e">REPORTS</text><text x="998" y="104" class="sans" font-size="20" font-weight="800" fill="#3fb950">80% auto</text><text x="1114" y="82" class="mono" font-size="10" fill="#8b949e">COMPANIES</text><text x="1114" y="104" class="sans" font-size="20" font-weight="800" fill="#d29922">2 in 1</text><line x1="872" y1="298" x2="1210" y2="298" stroke="#2a3542"/><rect class="grow d1" x="884" y="238" width="24" height="60" rx="4" fill="#58a6ff" fill-opacity="0.45"/><rect class="grow d2" x="924" y="213" width="24" height="85" rx="4" fill="#58a6ff" fill-opacity="0.52"/><rect class="grow d3" x="964" y="228" width="24" height="70" rx="4" fill="#58a6ff" fill-opacity="0.59"/><rect class="grow d4" x="1004" y="188" width="24" height="110" rx="4" fill="#58a6ff" fill-opacity="0.66"/><rect class="grow d5" x="1044" y="203" width="24" height="95" rx="4" fill="#58a6ff" fill-opacity="0.73"/><rect class="grow d6" x="1084" y="168" width="24" height="130" rx="4" fill="#58a6ff" fill-opacity="0.80"/><rect class="grow d7" x="1124" y="178" width="24" height="120" rx="4" fill="#58a6ff" fill-opacity="0.87"/><rect class="grow d8" x="1164" y="148" width="24" height="150" rx="4" fill="#58a6ff" fill-opacity="0.94"/><polyline class="draw" points="896,226 936,204 976,217 1016,181 1056,194 1096,163 1136,172 1176,145" fill="none" stroke="#f5fbff" stroke-width="2.5" stroke-linejoin="round"/></g>
</svg>
